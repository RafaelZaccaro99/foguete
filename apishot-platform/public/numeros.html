<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apishot — Números</title>
<style>
  :root{
    --bg0:#0a0b12;--bg1:#12131d;--glass:rgba(28,30,44,.72);--line:rgba(255,255,255,.08);
    --tx:#eef1f8;--mut:#98a1b8;--go:#25d366;--warn:#f6b73c;--bad:#ff5c6c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;color:var(--tx);
    background:linear-gradient(180deg,var(--bg0),var(--bg1));background-attachment:fixed;min-height:100vh;padding:28px 18px 60px}
  .wrap{max-width:1000px;margin:0 auto}
  .hero{display:flex;flex-direction:column;align-items:center;gap:7px;margin:8px 0 22px;text-align:center}
  .brand{font-weight:900;font-size:clamp(26px,6vw,38px);letter-spacing:1px;color:#4ef08a;text-shadow:0 0 24px rgba(37,211,102,.4)}
  .nav{display:flex;gap:10px;justify-content:center;margin-top:10px}
  .nav a{color:var(--mut);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
  .nav a.on{color:var(--go);border-color:rgba(37,211,102,.35)}
  .card{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
  .card h2{font-size:15.5px;margin-bottom:14px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .pill{display:inline-block;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:11px;color:var(--mut)}
  .pill.g{color:var(--go);border-color:rgba(37,211,102,.3)}.pill.w{color:var(--warn);border-color:rgba(246,183,60,.3)}.pill.b{color:var(--bad);border-color:rgba(255,92,108,.3)}
  button{border:none;color:#fff;font-weight:700;font-size:12.5px;padding:7px 13px;border-radius:9px;cursor:pointer;margin:2px;background:linear-gradient(135deg,#16c95f,#0a8f43)}
  button.ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--tx)}
  button.stop{background:linear-gradient(135deg,#ff5c6c,#d63447)}
  input,select,textarea{width:100%;background:rgba(6,7,12,.75);border:1px solid var(--line);border-radius:11px;color:var(--tx);padding:10px 12px;font-size:13.5px;font-family:inherit;margin-top:6px}
  label{display:block;font-size:12.5px;color:var(--mut);margin-top:12px;font-weight:600}
  .row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:180px}
  .hint{font-size:12px;color:var(--mut);margin-top:8px}
  .out{background:rgba(4,5,9,.8);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre-wrap;color:#cbd4e6}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="brand">🚀 APISHOT</div>
    <div class="nav">
      <a href="/disparo.html">Disparo</a>
      <a href="/conversas.html">Conversas</a>
      <a href="/numeros.html" class="on">Números</a>
    </div>
  </div>

  <div class="card">
    <h2>Números conectados</h2>
    <button class="ghost" onclick="sincronizar()">🔭 Buscar de novo</button>
    <table>
      <thead><tr><th>Número</th><th>Status</th><th>Qualidade</th><th>Limite/dia</th><th>Hoje</th><th></th></tr></thead>
      <tbody id="tbody"><tr><td colspan="6">Carregando…</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Criar template novo</h2>
    <div class="row">
      <div><label>Nome (minúsculas e _)</label><input type="text" id="ntName" placeholder="aceite_ifood_farma"></div>
      <div><label>Categoria</label><select id="ntCat"><option value="MARKETING">MARKETING</option><option value="UTILITY">UTILITY</option></select></div>
      <div><label>WABA (id da conta)</label><input type="text" id="ntWaba" placeholder="id da conta"></div>
    </div>
    <label>Corpo (pode usar {{1}} como variável, ex: nome)</label>
    <textarea id="ntBody" style="min-height:90px"></textarea>
    <label>Botões (opcional, um por linha) — LINK | Texto | https://... &nbsp;•&nbsp; RESPOSTA | Texto</label>
    <textarea id="ntBtns" style="min-height:60px"></textarea>
    <button onclick="criarTemplate()">⬆️ Subir template</button>
    <div class="out" id="ntOut">Aprovação da Meta: de minutos a poucas horas.</div>
  </div>

  <div class="card">
    <h2>Clonar template pra outras contas</h2>
    <div class="row">
      <div><label>WABA de origem</label><input type="text" id="clWabaOrigem"></div>
      <div><label>Nome do template</label><input type="text" id="clNome"></div>
      <div><label>Idioma</label><input type="text" id="clIdioma" value="pt_BR"></div>
    </div>
    <label>WABAs de destino (separe por vírgula)</label>
    <input type="text" id="clDestinos" placeholder="1422556032629403, 1583...">
    <button onclick="clonarTemplate()">📋 Clonar</button>
    <div class="out" id="clOut">Cria o mesmo template nas contas de destino e manda pra aprovação da Meta.</div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
async function api(path,opts){
  const r=await fetch(path,opts);
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.erro||('HTTP '+r.status));
  return data;
}

async function carregar(){
  const numeros=await api('/numeros');
  const linhas=await Promise.all(numeros.map(async n=>{
    try{ return await api('/numeros/'+n.id+'/status'); }catch(e){ return {...n, enviados_hoje:'?', limite_efetivo_hoje:n.limite_diario}; }
  }));
  $('tbody').innerHTML=linhas.map(n=>
    '<tr><td><b>'+esc(n.label)+'</b><div class="hint">'+esc(n.waba_id)+'</div></td>'+
    '<td><span class="pill '+(n.status==='ativo'?'g':n.status==='pausado'?'b':'w')+'">'+esc(n.status)+'</span></td>'+
    '<td><span class="pill '+(n.quality_rating==='GREEN'?'g':n.quality_rating==='RED'?'b':n.quality_rating==='YELLOW'?'w':'')+'">'+esc(n.quality_rating||'—')+'</span></td>'+
    '<td>'+n.limite_efetivo_hoje+(n.status==='aquecendo'?' <span class="hint">(aquecendo, de '+n.limite_diario+')</span>':'')+'</td>'+
    '<td>'+n.enviados_hoje+'</td>'+
    '<td>'+(n.status==='pausado'
      ? '<button onclick="ativar('+n.id+')">Ativar</button>'
      : '<button class="stop" onclick="pausar('+n.id+')">Pausar</button>')+'</td></tr>'
  ).join('')||'<tr><td colspan="6">Nenhum número cadastrado.</td></tr>';
}
async function pausar(id){ await api('/numeros/'+id+'/pausar',{method:'POST'}); carregar(); }
async function ativar(id){ await api('/numeros/'+id+'/ativar',{method:'POST'}); carregar(); }
async function sincronizar(){
  $('tbody').innerHTML='<tr><td colspan="6">Sincronizando…</td></tr>';
  try{ const r=await api('/numeros/sync',{method:'POST'}); alert('Sincronizado: '+r.novos+' novo(s), '+r.atualizados+' atualizado(s).'); }
  catch(e){ alert('Erro: '+e); }
  carregar();
}

async function criarTemplate(){
  try{
    const name=$('ntName').value.trim().toLowerCase().replace(/\s+/g,'_');
    const body=$('ntBody').value.trim();
    const wabaId=$('ntWaba').value.trim();
    if(!name||!body||!wabaId){ $('ntOut').textContent='Preenche nome, corpo e WABA.'; return; }
    const components=[{type:'BODY',text:body}];
    if(/\{\{1\}\}/.test(body)) components[0].example={body_text:[['Farmácia Central']]};
    const linhasBtn=$('ntBtns').value.split(/\n+/).map(l=>l.trim()).filter(Boolean);
    if(linhasBtn.length){
      const buttons=linhasBtn.map(l=>{
        const p=l.split('|').map(s=>s.trim()); const k=(p[0]||'').toUpperCase();
        if(k==='LINK'&&p.length>=3) return {type:'URL',text:p[1].slice(0,25),url:p[2]};
        if(k==='RESPOSTA'&&p.length>=2) return {type:'QUICK_REPLY',text:p[1].slice(0,25)};
        throw new Error('Botão inválido: '+l);
      });
      components.push({type:'BUTTONS',buttons});
    }
    const r=await api('/templates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      waba_id:wabaId, name, category:$('ntCat').value, language:'pt_BR', components,
    })});
    $('ntOut').textContent='SUBIU ✅ status '+(r.status||'PENDING')+' (id '+r.id+')';
  }catch(e){ $('ntOut').textContent='ERRO: '+e; }
}

async function clonarTemplate(){
  try{
    const destinos=$('clDestinos').value.split(',').map(s=>s.trim()).filter(Boolean);
    const r=await api('/templates/clonar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      waba_origem:$('clWabaOrigem').value.trim(), name:$('clNome').value.trim(), language:$('clIdioma').value.trim(), waba_destinos:destinos,
    })});
    $('clOut').textContent=JSON.stringify(r.resultados,null,2);
  }catch(e){ $('clOut').textContent='ERRO: '+e; }
}

carregar();
</script>
</body>
</html>
